name: US Stocks Paper Scan
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 13-22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: paper-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline unit tests
        run: python -m unittest -v test_scanner.py
      - name: Scan market data
        run: python scanner.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/latest.json results/history/
          git diff --cached --quiet || (git commit -m "Update paper scan results" && git push)
