name: US Stocks Paper Scan
on:
  workflow_dispatch:
  push:
    paths: ['**.py', 'requirements.txt', '.github/workflows/**']
  pull_request:
    paths: ['**.py', 'requirements.txt', '.github/workflows/**']
  schedule:
    # UTC union of summer/winter sessions; calendar in code is authoritative.
    - cron: '7,22,37,52 13-21 * * 1-5'
permissions:
  contents: read
concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v
  scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan market data
        run: python scanner.py
      - name: Evaluate prior paper signals
        if: ${{ !cancelled() }}
        run: python evaluate_signals.py
      - name: Advance paper portfolio
        if: ${{ !cancelled() }}
        run: python paper_portfolio.py
      - name: Preserve diagnostic results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: paper-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/v2/
            results/portfolio_v1/
          if-no-files-found: warn
      - name: Save results
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d results/v2 ]; then
            git add results/v2/ results/portfolio_v1/
            if ! git diff --cached --quiet; then
              git commit -m "Update v2 paper observations"
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
